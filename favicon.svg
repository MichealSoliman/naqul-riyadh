<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b5cad" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#grad)"/>
  <!-- Truck Body -->
  <g fill="#ffffff">
    <path d="M100 160 h180 v180 h-180 z" rx="16"/>
    <!-- Cab -->
    <path d="M280 200 h70 l50 60 v80 h-120 z" rx="12"/>
    <!-- Cab Window -->
    <path d="M295 215 h50 l35 45 h-85 z" fill="url(#grad)" opacity="0.9"/>
    <!-- Moving speed streaks -->
    <rect x="50" y="200" width="35" height="12" rx="6" fill="#38bdf8" />
    <rect x="30" y="230" width="55" height="12" rx="6" fill="#38bdf8" />
    <rect x="45" y="260" width="40" height="12" rx="6" fill="#38bdf8" />
    <!-- Bumper -->
    <rect x="400" y="325" width="20" height="15" rx="5" fill="#f59e0b" />
  </g>
  <!-- Wheels -->
  <!-- Back Wheel -->
  <circle cx="165" cy="345" r="45" fill="#0f172a"/>
  <circle cx="165" cy="345" r="22" fill="#e2e8f0"/>
  <!-- Front Wheel -->
  <circle cx="345" cy="345" r="45" fill="#0f172a"/>
  <circle cx="345" cy="345" r="22" fill="#e2e8f0"/>
</svg>
